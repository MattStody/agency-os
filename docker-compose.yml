# Local Postgres for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boldly_os
    ports:
      - "5432:5432"
    volumes:
      - boldly_pg:/var/lib/postgresql/data
volumes:
  boldly_pg:
